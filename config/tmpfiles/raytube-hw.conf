# raytube: let members of the "raytube" group write the few hardware controls
# cast-guard.sh uses, so it needs no sudo while casting. Install with:
#   sudo groupadd -f raytube && sudo usermod -aG raytube "$USER"
#   sudo install -m644 config/tmpfiles/raytube-hw.conf /etc/tmpfiles.d/
#   sudo systemd-tmpfiles --create /etc/tmpfiles.d/raytube-hw.conf
# (log out and in once for the group). Missing paths are skipped harmlessly.
#
# MacBook fans (applesmc): minimum speed, manual mode and target speed.
z /sys/devices/platform/applesmc.*/fan*_min    0664 root raytube -
z /sys/devices/platform/applesmc.*/fan*_manual 0664 root raytube -
z /sys/devices/platform/applesmc.*/fan*_output 0664 root raytube -
# Intel CPUs (intel_pstate): the heat cap and turbo on/off while casting.
z /sys/devices/system/cpu/intel_pstate/max_perf_pct 0664 root raytube -
z /sys/devices/system/cpu/intel_pstate/no_turbo     0664 root raytube -
